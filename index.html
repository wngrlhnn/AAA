<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><title>SWF Arcade</title><script src="https://unpkg.com/@ruffle-rs/ruffle"></script><style>body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:system-ui,Arial,sans-serif}header{padding:14px;background:#121722;position:sticky;top:0}.top,main{max-width:1100px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-size:22px;font-weight:900}.logo span{color:#7c5cff}.grow{flex:1}.btn{border:1px solid #293244;background:#171d29;color:#fff;padding:10px 14px;border-radius:11px;font-weight:700;cursor:pointer}.primary{background:#7c5cff;border-color:#7c5cff}.search{background:#171d29;color:#fff;border:1px solid #293244;border-radius:11px;padding:10px;width:260px}main{padding:25px 18px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{font-size:42px;margin:0 0 5px}.hero p,.meta,.empty,.status{color:#9da8b8}.orientationModal{position:fixed;inset:0;background:rgba(5,6,8,.88);display:none;place-items:center;z-index:100}.orientationBox{width:min(420px,calc(100% - 36px));background:#151a24;border:1px solid #293244;border-radius:20px;padding:24px;text-align:center}.orientationBox h2{margin-top:0}.orientationChoices{display:flex;gap:12px}.orientationChoices button{flex:1;padding:18px 10px;border:1px solid #293244;background:#111620;color:#fff;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer}.orientationChoices button:hover{background:#211d3b}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid #293244;background:transparent;color:#9da8b8;padding:8px 13px;border-radius:999px;cursor:pointer}.tab.active{background:#211d3b;color:#fff}.drop{border:1px dashed #4b5870;background:#10151f;border-radius:18px;padding:28px;text-align:center;margin-bottom:20px;cursor:pointer}.drop strong{display:block;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#151a24;border:1px solid #293244;border-radius:16px;padding:14px}.thumb{height:115px;border-radius:11px;background:#202635;display:grid;place-items:center;font-size:42px}.name{font-weight:800;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;border:1px solid #293244;background:#111620;color:#fff;padding:8px;border-radius:9px;cursor:pointer}.actions .play{background:#7c5cff;border-color:#7c5cff}#playerView{display:none}.playerHead{display:flex;gap:10px;align-items:center}.playerHead h2{flex:1;white-space:nowrap;overflow:hidden}.gameMenu{position:fixed;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(8px);display:none;place-items:center;z-index:200}.gameMenu.open{display:grid}.gameMenuBox{width:min(360px,calc(100% - 36px));background:#151a24;border:1px solid #3a455c;border-radius:22px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.gameMenuBox h3{margin:0 0 14px;font-size:22px}.gameMenuHint{color:#9da8b8;font-size:13px;margin-bottom:16px}.gameMenuActions{display:grid;gap:10px}.gameMenuActions button{border:1px solid #293244;background:#111620;color:#fff;padding:13px;border-radius:12px;font-weight:800;cursor:pointer}.gameMenuActions .danger{background:#7c5cff;border-color:#7c5cff}.gameMenuActions button.active{background:#211d3b;border-color:#7c5cff}.controls{position:absolute;inset:0;pointer-events:none;z-index:20}.controls.hidden{display:none}.playerShell{position:relative}.controlPad,.controlActions{position:absolute;bottom:18px;pointer-events:auto;touch-action:none}.controlPad{left:18px;width:154px;height:154px}.joystickBase{position:absolute;inset:20px;border:2px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(20,25,35,.72);box-shadow:inset 0 0 25px rgba(0,0,0,.35)}.joystickKnob{position:absolute;width:62px;height:62px;left:46px;top:46px;border-radius:50%;background:rgba(124,92,255,.9);border:2px solid rgba(255,255,255,.45);box-shadow:0 8px 20px rgba(0,0,0,.35)}.controlActions{right:18px;width:150px;height:150px}.vbtn{position:absolute;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(17,22,32,.88);color:#fff;font-size:17px;font-weight:900;box-shadow:0 7px 18px rgba(0,0,0,.35);touch-action:none}.vbtn:active{transform:scale(.94);background:#7c5cff}.a{right:0;top:48px}.b{right:48px;top:0}.x{right:48px;bottom:0}.y{left:0;top:48px}.dpad{position:absolute;bottom:18px;left:18px;width:150px;height:150px;pointer-events:auto;touch-action:none}.dpad .vbtn{width:48px;height:48px;border-radius:12px}.up{left:51px;top:0}.down{left:51px;bottom:0}.left{left:0;top:51px}.right{right:0;top:51px}.buttonOnlyActions{position:absolute;right:18px;bottom:18px;width:150px;height:150px;pointer-events:auto}.controls.mode-buttons .controlPad{display:none}.controls.mode-buttons .controlActions{display:none}.controls.mode-buttons .dpad{display:block}.controls.mode-buttons .buttonOnlyActions{display:block}.controls.mode-joystick .controlPad,.controls.mode-joystick .controlActions{display:block}.controls.mode-joystick .dpad,.controls.mode-joystick .buttonOnlyActions{display:none}.controls.mode-none>*{display:none!important}@media(max-width:650px){.controlPad,.dpad{left:10px;bottom:10px}.controlActions,.buttonOnlyActions{right:10px;bottom:10px}}.playerShell{background:#050608;border:1px solid #293244;border-radius:16px;overflow:hidden;min-height:300px}.playerShell ruffle-player{width:100%;height:72vh;display:block}@media(max-width:650px){.search{width:100%}.hero{align-items:flex-start;flex-direction:column}.hero .btn{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.playerShell ruffle-player{height:60vh}}</style></head><body><header><div class="top"><div class="logo">SWF <span>ARCADE</span></div><div class="grow"></div><input id="search" class="search" placeholder="חיפוש משחק…"><input id="files" type="file" accept=".swf" multiple hidden></div></header><main><section id="library"><div class="hero"><div><h1>משחקי Flash שלך</h1><p>פתח משחקי SWF מקומיים ושחק בהם עם Ruffle.</p></div></div><div class="tabs"><button class="tab active" data-filter="all">הכול</button><button class="tab" data-filter="fav">מועדפים</button><button class="tab" data-filter="recent">אחרונים</button><select id="sort" class="tab"><option value="recent">נוספו לאחרונה</option><option value="name">שם א׳-ת׳</option><option value="size">גודל</option></select></div><div id="drop" class="drop"><strong>לחץ כדי לבחור משחקים מהמכשיר</strong></div><div id="grid" class="grid"></div><div id="empty" class="empty">עדיין אין משחקים. הוסף קובץ SWF כדי להתחיל.</div></section><section id="playerView"><div class="playerHead"><button id="back" class="btn">← חזרה</button><h2 id="title">משחק</h2><button id="full" class="btn">⛶</button></div><div id="shell" class="playerShell"><div id="controls" class="controls mode-none" aria-label="בקרי משחק"><div id="joystickBase" class="controlPad"><div class="joystickBase"></div><div id="joystickKnob" class="joystickKnob"></div></div><div class="controlActions"><button id="btnA" class="vbtn a">A</button><button id="btnB" class="vbtn b">B</button><button id="btnX" class="vbtn x">X</button><button id="btnY" class="vbtn y">Y</button></div><div class="dpad"><button id="btnUp" class="vbtn up">▲</button><button id="btnDown" class="vbtn down">▼</button><button id="btnLeft" class="vbtn left">◀</button><button id="btnRight" class="vbtn right">▶</button></div><div class="buttonOnlyActions"><button id="btnA2" class="vbtn a">A</button><button id="btnB2" class="vbtn b">B</button><button id="btnX2" class="vbtn x">X</button><button id="btnY2" class="vbtn y">Y</button></div></div></div><div id="status" class="status"></div></section></main><script>(()=>{const $=s=>document.querySelector(s),fi=$("#files"),grid=$("#grid"),empty=$("#empty"),drop=$("#drop");let games=[],filter="all",db;function init(){return new Promise((ok,no)=>{let r=indexedDB.open("swf-arcade",1);r.onupgradeneeded=()=>r.result.createObjectStore("games",{keyPath:"id"});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function store(m){return db.transaction("games",m).objectStore("games")}function put(g){return new Promise((ok,no)=>{let r=store("readwrite").put(g);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function del(id){return new Promise((ok,no)=>{let r=store("readwrite").delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function all(){return new Promise((ok,no)=>{let r=store("readonly").getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function render(){let q=$("#search").value.toLowerCase(),list=games.filter(g=>(filter==="all"||(filter==="fav"&&g.favorite)||(filter==="recent"&&g.added))&&g.name.toLowerCase().includes(q));let sort=$("#sort")?.value||"recent";list.sort((a,b)=>sort==="name"?a.name.localeCompare(b.name):sort==="size"?b.size-a.size:(b.added||0)-(a.added||0));grid.innerHTML="";empty.style.display=list.length?"none":"block";list.forEach(g=>{let c=document.createElement("article");c.className="card";c.innerHTML='<div class="thumb">🎮</div><div class="name"></div><div class="meta"></div><div class="actions"><button class="play">▶ שחק</button><button class="fav"></button><button class="del">🗑</button></div>';c.querySelector(".name").textContent=g.name;c.querySelector(".meta").textContent=(g.size/1048576).toFixed(1)+" MB";c.querySelector(".fav").textContent=g.favorite?"★":"☆";c.querySelector(".play").onclick=()=>play(g);c.querySelector(".fav").onclick=async()=>{g.favorite=!g.favorite;await put(g);render()};c.querySelector(".del").onclick=async()=>{if(confirm("למחוק את המשחק?")){await del(g.id);games=games.filter(x=>x.id!==g.id);render()}};grid.appendChild(c)})}function makeId(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+"-"+Math.random().toString(36).slice(2))}async function add(fs){try{let added=0;for(let f of fs){if(!/\.swf$/i.test(f.name))continue;let g={id:makeId(),name:f.name.replace(/\.swf$/i,""),size:f.size,data:await f.arrayBuffer(),favorite:false,added:Date.now()};await put(g);games.push(g);added++}render();if(!added&&fs.length)alert("יש לבחור קובץ SWF עם סיומת ‎.swf");}catch(e){console.error(e);alert("לא הצלחתי להוסיף את המשחק: "+(e?.message||e))}finally{fi.value=""}}async function play(g){$("#orientationModal").style.display="grid";let choice=await new Promise(resolve=>{$("#portrait").onclick=()=>resolve("portrait");$("#landscape").onclick=()=>resolve("landscape")});$("#orientationModal").style.display="none";if(window.AndroidBridge)AndroidBridge.setOrientation(choice);$("#library").style.display="none";$("#playerView").style.display="block";$("#title").textContent=g.name;$("#status").textContent="טוען משחק…";let shell=$("#shell");shell.innerHTML="";try{let api=window.RufflePlayer?.newest();if(!api)throw Error("Ruffle unavailable");let p=api.createPlayer();shell.appendChild(p);await p.ruffle().load({data:new Uint8Array(g.data),letterbox:"fullscreen"});$("#status").textContent="";$("#full").onclick=()=>p.ruffle().requestFullscreen()}catch(e){console.error(e);$("#status").textContent="לא ניתן לטעון את המשחק הזה ב-Ruffle."}}fi.onchange=()=>add([...fi.files]);
const gameMenu=$("#gameMenu");
let touchStart=null, currentPlayer=null, controlMode="none", orientation="portrait";
const controls=$("#controls");
const pressedKeys=new Set();
function emitKey(key,down=true){
  if(down){if(pressedKeys.has(key))return;pressedKeys.add(key)}
  else {if(!pressedKeys.has(key))return;pressedKeys.delete(key)}
  const ev=new KeyboardEvent(down?"keydown":"keyup",{key,code:key,bubbles:true,cancelable:true});
  document.dispatchEvent(ev); window.dispatchEvent(ev);
}
function releaseAll(){[...pressedKeys].forEach(k=>emitKey(k,false))}
function setControlMode(mode){
  releaseAll(); controlMode=mode;
  controls.classList.remove("mode-joystick","mode-buttons","mode-none");
  controls.classList.add("mode-"+mode);
  document.querySelectorAll(".controlModeBtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  closeGameMenu();
}
function bindButton(el,key){
  if(!el)return;
  const down=e=>{e.preventDefault();emitKey(key,true)};
  const up=e=>{e.preventDefault();emitKey(key,false)};
  el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("pointerleave",up);
}
function bindJoystick(){
  const base=$("#joystickBase"),knob=$("#joystickKnob"); if(!base)return;
  let active=false,last=[];
  const setDir=(x,y)=>{
    const dirs=[]; const d=Math.hypot(x,y);
    if(d>25){if(Math.abs(x)>35)dirs.push(x>0?"ArrowRight":"ArrowLeft");if(Math.abs(y)>35)dirs.push(y>0?"ArrowDown":"ArrowUp")}
    last.filter(k=>!dirs.includes(k)).forEach(k=>emitKey(k,false));
    dirs.filter(k=>!last.includes(k)).forEach(k=>emitKey(k,true)); last=dirs;
    knob.style.transform=`translate(${Math.max(-45,Math.min(45,x))}px,${Math.max(-45,Math.min(45,y))}px)`;
  };
  base.addEventListener("pointerdown",e=>{e.preventDefault();active=true;base.setPointerCapture?.(e.pointerId);const r=base.getBoundingClientRect();setDir(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))});
  base.addEventListener("pointermove",e=>{if(!active)return;const r=base.getBoundingClientRect();setDir(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))});
  const stop=()=>{active=false;last.forEach(k=>emitKey(k,false));last=[];knob.style.transform="translate(0,0)"};
  base.addEventListener("pointerup",stop);base.addEventListener("pointercancel",stop);
}
function initControls(){
  [["#btnA","Enter"],["#btnB","Escape"],["#btnX","KeyX"],["#btnY","KeyZ"],["#btnUp","ArrowUp"],["#btnDown","ArrowDown"],["#btnLeft","ArrowLeft"],["#btnRight","ArrowRight"],["#btnA2","Enter"],["#btnB2","Escape"],["#btnX2","KeyX"],["#btnY2","KeyZ"]].forEach(([s,k])=>bindButton($(s),k));
  bindJoystick();
}

function closeGameMenu(){gameMenu.classList.remove("open");gameMenu.setAttribute("aria-hidden","true")}
function openGameMenu(){if($("#playerView").style.display!=="block")return;gameMenu.classList.add("open");gameMenu.setAttribute("aria-hidden","false")}
drop.onclick=()=>fi.click();
document.addEventListener("touchstart",e=>{
  if($("#playerView").style.display!=="block" || e.touches.length!==2){touchStart=null;return}
  touchStart={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!touchStart)return;
  const endX=e.changedTouches.length>=2
    ? (e.changedTouches[0].clientX+e.changedTouches[1].clientX)/2
    : e.changedTouches[0]?.clientX;
  if(typeof endX==="number" && endX-touchStart.x>90){openGameMenu()}
  touchStart=null;
},{passive:true});
$("#menuResume").onclick=closeGameMenu;
$("#menuRotate").onclick=()=>{orientation=orientation==="portrait"?"landscape":"portrait";if(window.AndroidBridge)AndroidBridge.setOrientation(orientation);$("#menuRotate").textContent=orientation==="landscape"?"↕️ סיבוב מסך — לאורך":"↔️ סיבוב מסך — לרוחב"};
document.querySelectorAll(".controlModeBtn").forEach(b=>b.onclick=()=>setControlMode(b.dataset.mode));
initControls();
$("#gameMenu").onclick=e=>{if(e.target===gameMenu)closeGameMenu()};
$("#menuFull").onclick=()=>$("#full").click();
$("#menuBack").onclick=()=>{closeGameMenu();$("#back").click()};drop.onclick=()=>fi.click();drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();add([...e.dataTransfer.files])};$("#search").oninput=render;$("#sort").onchange=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});$("#back").onclick=()=>{closeGameMenu();releaseAll();setControlMode("none");if(window.AndroidBridge)AndroidBridge.resetOrientation();$("#playerView").style.display="none";$("#library").style.display="block";$("#shell").innerHTML=""};init().then(all).then(x=>{games=x;render()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();</script><div id="orientationModal" class="orientationModal"><div class="orientationBox"><h2>בחר כיוון למשחק</h2><p class="meta">איך תרצה לשחק?</p><div class="orientationChoices"><button id="portrait">↕️<br>לאורך</button><button id="landscape">↔️<br>לרוחב</button></div></div></div><div id="gameMenu" class="gameMenu" aria-hidden="true"><div class="gameMenuBox" role="dialog" aria-label="תפריט משחק"><h3>תפריט משחק</h3><div class="gameMenuHint">החלקה עם שתי אצבעות ימינה פותחת את התפריט</div><div class="gameMenuActions"><button id="menuResume">▶ המשך משחק</button><button id="menuRotate">↔️ סיבוב מסך</button><button id="menuFull">⛶ מסך מלא</button><button class="controlModeBtn" data-mode="joystick">🕹️ ג׳ויסטיק + כפתורים</button><button class="controlModeBtn" data-mode="buttons">🎮 רק כפתורים</button><button class="controlModeBtn" data-mode="none">🚫 כיבוי בקרות</button><button id="menuBack" class="danger">← חזרה למשחקים</button></div></div></div></body></html>
