<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><title>SWF Arcade</title><script src="ruffle/ruffle.js"></script><style>body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:system-ui,Arial,sans-serif}header{padding:14px;background:#121722;position:sticky;top:0}.top,main{max-width:1100px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-size:22px;font-weight:900}.logo span{color:#7c5cff}.grow{flex:1}.btn{border:1px solid #293244;background:#171d29;color:#fff;padding:10px 14px;border-radius:11px;font-weight:700;cursor:pointer}.primary{background:#7c5cff;border-color:#7c5cff}.search{background:#171d29;color:#fff;border:1px solid #293244;border-radius:11px;padding:10px;width:260px}main{padding:25px 18px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{font-size:42px;margin:0 0 5px}.hero p,.meta,.empty,.status{color:#9da8b8}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid #293244;background:transparent;color:#9da8b8;padding:8px 13px;border-radius:999px;cursor:pointer}.tab.active{background:#211d3b;color:#fff}.drop{border:1px dashed #4b5870;background:#10151f;border-radius:18px;padding:28px;text-align:center;margin-bottom:20px;cursor:pointer}.drop strong{display:block;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#151a24;border:1px solid #293244;border-radius:16px;padding:14px}.thumb{height:115px;border-radius:11px;background:#202635;display:grid;place-items:center;font-size:42px}.name{font-weight:800;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;border:1px solid #293244;background:#111620;color:#fff;padding:8px;border-radius:9px;cursor:pointer}.actions .play{background:#7c5cff;border-color:#7c5cff}#playerView{display:none}.playerHead{display:flex;gap:10px;align-items:center}.playerHead h2{flex:1;white-space:nowrap;overflow:hidden}.playerShell{background:#050608;border:1px solid #293244;border-radius:16px;overflow:hidden;min-height:300px}.playerShell ruffle-player{width:100%;height:72vh;display:block}@media(max-width:650px){.search{width:100%}.hero{align-items:flex-start;flex-direction:column}.hero .btn{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.playerShell ruffle-player{height:60vh}}</style></head><body><header><div class="top"><div class="logo">SWF <span>ARCADE</span></div><div class="grow"></div><input id="search" class="search" placeholder="חיפוש משחק…"><button id="add" class="btn primary">＋ הוסף משחק</button><input id="files" type="file" accept=".swf,application/x-shockwave-flash" multiple hidden></div></header><main><section id="library"><div class="hero"><div><h1>משחקי Flash שלך</h1><p>פתח משחקי SWF מקומיים ושחק בהם עם Ruffle.</p></div></div><div class="tabs"><button class="tab active" data-filter="all">הכול</button><button class="tab" data-filter="fav">מועדפים</button></div><div id="drop" class="drop"><strong>גרור לכאן קבצי SWF</strong><small>או לחץ כדי לבחור משחקים מהמכשיר</small></div><div id="grid" class="grid"></div><div id="empty" class="empty">עדיין אין משחקים. הוסף קובץ SWF כדי להתחיל.</div></section><section id="playerView"><div class="playerHead"><button id="back" class="btn">← חזרה</button><h2 id="title">משחק</h2><button id="full" class="btn">⛶</button></div><div id="shell" class="playerShell"></div><div id="status" class="status"></div></section></main><script>(()=>{const $=s=>document.querySelector(s),fi=$("#files"),grid=$("#grid"),empty=$("#empty"),drop=$("#drop");let games=[],filter="all",db;function init(){return new Promise((ok,no)=>{let r=indexedDB.open("swf-arcade",1);r.onupgradeneeded=()=>r.result.createObjectStore("games",{keyPath:"id"});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function store(m){return db.transaction("games",m).objectStore("games")}function put(g){return new Promise((ok,no)=>{let r=store("readwrite").put(g);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function del(id){return new Promise((ok,no)=>{let r=store("readwrite").delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}function all(){return new Promise((ok,no)=>{let r=store("readonly").getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function render(){let q=$("#search").value.toLowerCase(),list=games.filter(g=>(filter==="all"||g.favorite)&&g.name.toLowerCase().includes(q));grid.innerHTML="";empty.style.display=list.length?"none":"block";list.forEach(g=>{let c=document.createElement("article");c.className="card";c.innerHTML='<div class="thumb">🎮</div><div class="name"></div><div class="meta"></div><div class="actions"><button class="play">▶ שחק</button><button class="fav"></button><button class="del">🗑</button></div>';c.querySelector(".name").textContent=g.name;c.querySelector(".meta").textContent=(g.size/1048576).toFixed(1)+" MB";c.querySelector(".fav").textContent=g.favorite?"★":"☆";c.querySelector(".play").onclick=()=>play(g);c.querySelector(".fav").onclick=async()=>{g.favorite=!g.favorite;await put(g);render()};c.querySelector(".del").onclick=async()=>{if(confirm("למחוק את המשחק?")){await del(g.id);games=games.filter(x=>x.id!==g.id);render()}};grid.appendChild(c)})}async function add(fs){for(let f of fs){if(!/\\.swf$/i.test(f.name))continue;let g={id:crypto.randomUUID(),name:f.name.replace(/\\.swf$/i,""),size:f.size,data:await f.arrayBuffer(),favorite:false};games.push(g);await put(g)}render()}async function play(g){$("#library").style.display="none";$("#playerView").style.display="block";$("#title").textContent=g.name;$("#status").textContent="טוען משחק…";let shell=$("#shell");shell.innerHTML="";try{let api=window.RufflePlayer?.newest();if(!api)throw Error("Ruffle unavailable");let p=api.createPlayer();shell.appendChild(p);await p.ruffle().load({data:new Uint8Array(g.data),letterbox:"fullscreen"});$("#status").textContent="";$("#full").onclick=()=>p.ruffle().requestFullscreen()}catch(e){console.error(e);$("#status").textContent="לא ניתן לטעון את המשחק הזה ב-Ruffle."}}$("#add").onclick=()=>fi.click();fi.onchange=()=>add([...fi.files]);drop.onclick=()=>fi.click();drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();add([...e.dataTransfer.files])};$("#search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});$("#back").onclick=()=>{$("#playerView").style.display="none";$("#library").style.display="block";$("#shell").innerHTML=""};init().then(all).then(x=>{games=x;render()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();</script></body></html>
