plugins { id 'com.android.application' }

android {
    namespace 'com.wngrlhnn.swfarcade'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wngrlhnn.swfarcade'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
