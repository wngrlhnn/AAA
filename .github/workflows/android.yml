name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable app signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d app/swfarcade.keystore.b64 > app/swfarcade.keystore
          test -s app/swfarcade.keystore

      - name: Download official Ruffle self-hosted package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ruffle
          url="$(python3 -c "import json,urllib.request; r=json.load(urllib.request.urlopen('https://api.github.com/repos/ruffle-rs/ruffle/releases/latest')); print(next(a['browser_download_url'] for a in r['assets'] if 'web-selfhosted.zip' in a['name']))")"
          curl -L --fail "$url" -o /tmp/ruffle.zip
          rm -rf app/src/main/assets/ruffle/*
          rm -rf /tmp/ruffle-unpacked
          unzip -q /tmp/ruffle.zip -d /tmp/ruffle-unpacked
          ruffle_js="$(find /tmp/ruffle-unpacked -type f -name 'ruffle.js' -print -quit)"
          test -n "$ruffle_js"
          ruffle_root="$(dirname "$ruffle_js")"
          cp -R "$ruffle_root"/. app/src/main/assets/ruffle/
          test -f app/src/main/assets/ruffle/ruffle.js

      - name: Prepare complete offline web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace("https://unpkg.com/@ruffle-rs/ruffle", "ruffle/ruffle.js")
          p.write_text(s)
          PY
          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp sw.js app/src/main/assets/sw.js
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/ruffle/ruffle.js

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SWF-Arcade-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
